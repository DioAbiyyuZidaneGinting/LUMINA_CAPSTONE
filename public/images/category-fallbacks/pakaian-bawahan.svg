<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Sleek Dark Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Accent -->
  <path d="M 0,200 L 800,200 M 0,400 L 800,400 M 0,600 L 800,600 M 0,800 L 800,800" stroke="#334155" stroke-width="1" stroke-opacity="0.15" />
  <path d="M 200,0 L 200,1000 M 400,0 L 400,1000 M 600,0 L 600,1000" stroke="#334155" stroke-width="1" stroke-opacity="0.15" />
  
  <!-- Modern Geometric Layout -->
  <circle cx="400" cy="500" r="280" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="10 15" />
  <circle cx="400" cy="500" r="220" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />
  <rect x="150" y="250" width="500" height="500" rx="32" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Core Text Content -->
  <g transform="translate(0, 500)">
    <!-- Decorative Category Label -->
    <text x="50%" y="-60" dominant-baseline="middle" text-anchor="middle" fill="#14b8a6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="8" fill-opacity="0.9">LUMINA SELECTIONS</text>
    
    <!-- Large Bold Category Title -->
    <text x="50%" y="0" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="4">PAKAIAN BAWAHAN</text>
    
    <!-- Elegant Subtitle -->
    <text x="50%" y="50" dominant-baseline="middle" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill-opacity="0.6">ESSENTIAL BOTTOMS</text>
  </g>
  
  <!-- Minimalist Corner Branding -->
  <text x="60" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" letter-spacing="3" fill-opacity="0.4">LM</text>
  <text x="740" y="80" text-anchor="end" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill-opacity="0.2">© 2026</text>
  <line x1="60" y1="920" x2="740" y2="920" stroke="#334155" stroke-width="1" stroke-opacity="0.2" />
  <text x="60" y="945" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" letter-spacing="2" fill-opacity="0.25">ESTABLISHED 2026</text>
</svg>